[project]
name = "clipd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipd*"]

# templates/ and static/ are data, not modules, so packages.find does not
# collect them. The Dockerfile installs with `pip install .`, so without this
# StaticFiles raises RuntimeError inside create_app on the missing directory —
# the container dies on boot and compose restarts it forever — and nothing in
# local development would catch it, because the source tree is importable.
[tool.setuptools.package-data]
clipd = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
