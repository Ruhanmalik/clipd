# Root config: the cross-package integration suite only.
#
# The two unit suites keep their own rootdir and are run from their own
# directories (`cd server && pytest`, `cd client && pytest`); this file does
# not affect them.
#
# pythonpath is what makes `import clipd` and `import clipwatch` work in one
# process. Deliberately not relying on the editable installs: they are per
# machine, and on at least one of them the clipwatch .pth file carries macOS's
# hidden flag, which site.py silently skips.
[pytest]
testpaths = tests/integration
pythonpath = server client
